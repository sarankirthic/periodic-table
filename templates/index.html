<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table of the Elements</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="masthead">
    <div class="mast-left">
      <h1>Periodic Table<span>of the Elements</span></h1>
      <p class="mast-sub">IUPAC nomenclature, 2009 &middot; 118 elements &middot; hover any element for full detail</p>
    </div>
    <div class="mast-right">
      <div class="legend-key" id="legendKey"></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="table-scaler" id="scaler">
      <!-- Reference / key cell explaining the template -->
      <div class="keycell-wrap" id="keycellWrap"></div>
      <div class="ptable" id="ptable"></div>
    </div>
  </main>

  <!-- Hover detail window -->
  <div class="popup" id="popup" aria-hidden="true">
    <div class="popup-inner">
      <div class="popup-cell" id="popupCell"></div>
      <div class="popup-detail" id="popupDetail"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script/elements.js') }}"></script>
  <script src="{{ url_for('static', filename='script/index.js') }}"></script>
</body>
</html>
